<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>genie 홈</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --blue:#1a8cff; --blue-deep:#0b4fd6; --ink:#0f1b2d; --muted:#6b7a8c;
  --line:#e4eaf1; --mist:#f3f7fb; --sky:#eaf4ff; --track:#dce4ee;
  --g1:linear-gradient(135deg,#1a8cff,#6c5ce7);
  --g2:linear-gradient(135deg,#ff8a5b,#ff4d7d);
  --g3:linear-gradient(135deg,#2dd4a7,#1a8cff);
  --g4:linear-gradient(135deg,#0f1b2d,#3b5bdb);
  --g5:linear-gradient(135deg,#ffd166,#ff8a5b);
  --g6:linear-gradient(135deg,#a78bfa,#ec4899);
  --g7:linear-gradient(135deg,#38bdf8,#0b4fd6);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Noto Sans KR',sans-serif;color:var(--ink);background:#fff;line-height:1.45;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block;flex:none}

.app{display:grid;grid-template-columns:240px 1fr;height:100%;min-width:960px}

/* sidebar */
.side{border-right:1px solid var(--line);padding:24px 20px 112px;display:flex;flex-direction:column;overflow:hidden}
.logo{display:flex;align-items:flex-end;gap:3px;margin:0 8px 20px;font-size:30px;font-weight:900;color:var(--blue);line-height:1.45}
.logo i{width:8px;height:8px;border-radius:4px;background:var(--ink);margin-bottom:10px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;height:48px;padding:0 12px;border-radius:12px;font-size:16px;font-weight:500;color:var(--muted);text-align:left}
.nav button[aria-current=page]{background:var(--sky);color:var(--blue);font-weight:700}
.nav button:hover:not([aria-current]){background:var(--mist)}
.mypl{margin-top:auto;padding:0 12px}
.mypl h2{font-size:13px;font-weight:500;color:var(--muted);margin-bottom:14px}
.mypl button{display:flex;align-items:center;gap:10px;width:100%;margin-bottom:12px;font-size:14px;font-weight:500;text-align:left}
.cover{border-radius:16px;flex:none}
.mypl .cover{width:36px;height:36px;border-radius:8px}

/* main */
.main{display:flex;flex-direction:column;min-width:0;height:100%}
.top{height:80px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 48px}
.search{display:flex;align-items:center;gap:10px;width:520px;max-width:100%;height:48px;padding:0 16px;border-radius:14px;background:var(--mist);color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;font:inherit;font-size:15px;color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.search:focus-within{box-shadow:0 0 0 1.5px var(--blue);background:#fff}
.me{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:500}
.avatar{width:40px;height:40px;border-radius:20px;background:var(--g1)}
.scroll{flex:1;overflow-y:auto;padding:8px 48px 128px;display:flex;flex-direction:column;gap:20px}

/* hero */
.hero{position:relative;flex:none;height:250px;border-radius:28px;overflow:hidden;color:#fff;
  background:linear-gradient(167deg,var(--blue),var(--blue-deep));padding:24px 36px;display:flex;flex-direction:column;align-items:flex-start}
.hero .tag{font-size:13px;font-weight:500;background:rgba(255,255,255,.2);padding:4px 14px;border-radius:16px}
.hero h1{margin-top:12px;font-size:34px;font-weight:900;line-height:1.45;letter-spacing:-.5px}
.hero .meta{margin-top:6px;font-size:14px}
.hero .acts{margin-top:14px;display:flex;align-items:center;gap:14px}
.round{display:flex;align-items:center;justify-content:center;border-radius:50%;flex:none}
.hero .play{width:42px;height:42px;background:#fff}
.hero .save{height:42px;padding:0 20px;border:1px solid rgba(255,255,255,.6);border-radius:22px;font-size:14px;font-weight:500}
.hero .save[aria-pressed=true]{background:#fff;color:var(--blue);font-weight:700}
.hero .covers{position:absolute;top:35px;left:555px;display:flex;gap:16px}
.hero .covers div{width:180px;height:180px;border-radius:20px;flex:none}

/* sections */
.sec-head{display:flex;align-items:center;justify-content:space-between}
.sec-head h2{font-size:22px;font-weight:700}
.more{font-size:14px;font-weight:500;color:var(--blue)}
.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:20px;margin-top:12px}
.card{text-align:left;min-width:0}
.card .cover{width:100%;aspect-ratio:1}
.card b{display:block;margin-top:8px;font-size:15px;font-weight:500}
.card span{display:block;font-size:13px;color:var(--muted)}
.card:hover .cover{transform:translateY(-2px);transition:transform .15s}

.two{display:grid;grid-template-columns:minmax(0,1fr) 406px;gap:64px}
.rows{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:30px 32px minmax(0,1fr) 103px 84px 32px;align-items:center;gap:0 14px;height:32px;font-size:13px;color:var(--muted)}
.row .no{font-size:14px}
.row .cover{width:32px;height:32px;border-radius:6px}
.row .t b{display:block;font-size:14px;font-weight:500;color:var(--ink);line-height:1.3}
.row .t span{display:block;font-size:11px;line-height:1.3}
.row .pbtn{width:32px;height:32px;background:var(--blue)}

.tabs{display:flex;gap:8px}
.tabs button{height:29px;padding:0 14px;border-radius:16px;background:var(--mist);color:var(--muted);font-size:12px;font-weight:500}
.tabs button[aria-selected=true]{background:var(--ink);color:#fff;font-weight:700}
.chart{margin-top:12px;display:flex;flex-direction:column;gap:3px}
.chart .c{display:grid;grid-template-columns:28px 20px minmax(0,1fr) auto;align-items:center;gap:0 8px;height:20px;font-size:12px}
.chart .c i{font-style:normal;font-weight:700;color:var(--blue)}
.chart .c .cover{width:20px;height:20px;border-radius:4px}
.chart .c b{font-weight:500}
.chart .c span{font-size:11px;color:var(--muted)}

/* player */
.player{position:fixed;left:0;right:0;bottom:0;height:96px;background:#fff;border-top:1px solid var(--line);
  display:grid;grid-template-columns:1fr 520px 1fr;align-items:center;padding:0 32px calc(0px + env(safe-area-inset-bottom,0px))}
.np{display:flex;align-items:center;gap:14px}
.np .cover{width:56px;height:56px;border-radius:10px}
.np b{display:block;font-size:15px;font-weight:700}
.np span{display:block;font-size:13px;color:var(--muted)}
.np .like{margin-left:auto;margin-right:64px}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:8px}
.btns{display:flex;align-items:center;gap:28px}
.btns .big{width:44px;height:44px;background:var(--blue)}
.prog{display:flex;align-items:center;gap:12px;width:100%;font-size:12px;color:var(--muted)}
.bar{flex:1;height:5px;border-radius:3px;background:var(--track);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--blue);border-radius:3px}
.vol{display:flex;align-items:center;gap:20px;justify-content:flex-end}
.vol .bar{flex:none;width:100px}

@media (max-width:1280px){.hero .covers{left:auto;right:-60px}}
@media (max-width:1100px){.two{grid-template-columns:1fr}.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.hero .covers{display:none}.np .like{margin-right:0}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo">genie<i></i></div>
    <nav class="nav" aria-label="주 메뉴">
      <button aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>홈</button>
      <button><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/></svg>검색</button>
      <button><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>탐색</button>
      <button><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>보관함</button>
    </nav>
    <div class="mypl">
      <h2>내 플레이리스트</h2>
      <button><div class="cover" style="background:var(--g1)"></div>출근길 아침</button>
      <button><div class="cover" style="background:var(--g4)"></div>새벽 감성</button>
      <button><div class="cover" style="background:var(--g3)"></div>공부할 때</button>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <label class="search">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/></svg>
        <input type="search" placeholder="아티스트, 곡, 앨범, 플레이리스트 검색" aria-label="검색">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1a8cff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </label>
      <div class="me"><span>지민님</span><div class="avatar"></div></div>
    </header>

    <div class="scroll">
      <section class="hero">
        <span class="tag">지민님을 위한 오늘의 믹스</span>
        <h1>퇴근길엔 잔잔한 인디팝<br>어때요?</h1>
        <p class="meta">새벽 세 시의 도시 외 24곡 · 1시간 32분</p>
        <div class="acts">
          <button class="round play" aria-label="믹스 재생"><svg width="21" height="21" viewBox="0 0 24 24" fill="#1a8cff"><path d="M8 5v14l11-7z"/></svg></button>
          <button class="save" aria-pressed="false">믹스 저장</button>
        </div>
        <div class="covers" aria-hidden="true">
          <div style="background:var(--g7)"></div><div style="background:var(--g2)"></div><div style="background:var(--g5)"></div>
        </div>
      </section>

      <section>
        <div class="sec-head"><h2>이어 듣기</h2><button class="more">전체보기</button></div>
        <div class="cards">
          <button class="card"><div class="cover" style="background:var(--g1)"></div><b>여름밤 산책</b><span>플레이리스트</span></button>
          <button class="card"><div class="cover" style="background:var(--g2)"></div><b>Rainy Mood</b><span>플레이리스트</span></button>
          <button class="card"><div class="cover" style="background:var(--g3)"></div><b>집중 모드</b><span>플레이리스트</span></button>
          <button class="card"><div class="cover" style="background:var(--g5)"></div><b>주말 드라이브</b><span>플레이리스트</span></button>
          <button class="card"><div class="cover" style="background:var(--g6)"></div><b>파란 우산</b><span>소담</span></button>
          <button class="card"><div class="cover" style="background:var(--g4)"></div><b>Late Bus</b><span>노을</span></button>
        </div>
      </section>

      <div class="two">
        <section>
          <div class="sec-head"><h2>오늘의 추천</h2><button class="more">전체보기</button></div>
          <div class="rows">
            <div class="row"><span class="no">1</span><div class="cover" style="background:var(--g6)"></div><div class="t"><b>파란 우산</b><span>소담</span></div><span>취향 92%</span><span>3:12</span><button class="round pbtn" aria-label="파란 우산 재생"><svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></button></div>
            <div class="row"><span class="no">2</span><div class="cover" style="background:var(--g4)"></div><div class="t"><b>Late Bus</b><span>노을</span></div><span>취향 88%</span><span>4:01</span><button class="round pbtn" aria-label="Late Bus 재생"><svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></button></div>
            <div class="row"><span class="no">3</span><div class="cover" style="background:var(--g5)"></div><div class="t"><b>노을 지는 방</b><span>온도</span></div><span>취향 82%</span><span>3:35</span><button class="round pbtn" aria-label="노을 지는 방 재생"><svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></button></div>
          </div>
        </section>

        <section>
          <div class="sec-head"><h2>차트 · 신곡</h2>
            <div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-t="chart">실시간 차트</button><button role="tab" aria-selected="false" data-t="new">신곡</button></div>
          </div>
          <div class="chart" id="list"></div>
        </section>
      </div>
    </div>
  </div>
</div>

<footer class="player">
  <div class="np">
    <div class="cover" style="background:var(--g7)"></div>
    <div><b>새벽 세 시의 도시</b><span>하린</span></div>
    <button class="like" aria-label="좋아요"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6b7a8c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/></svg></button>
  </div>
  <div class="ctrl">
    <div class="btns">
      <button aria-label="셔플"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1a8cff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
      <button aria-label="이전 곡"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0f1b2d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 5v14L8 12zM5 5v14"/></svg></button>
      <button class="round big" id="pp" aria-label="재생"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></button>
      <button aria-label="다음 곡"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0f1b2d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5v14l11-7zM19 5v14"/></svg></button>
      <button aria-label="반복"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1a8cff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></svg></button>
    </div>
    <div class="prog"><span>1:24</span><div class="bar"><i style="width:37%"></i></div><span>3:48</span></div>
  </div>
  <div class="vol">
    <button aria-label="재생 대기열"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6b7a8c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h12M4 12h8M4 18h8M17 14v6M14 17h6"/></svg></button>
    <button aria-label="음량"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6b7a8c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9zM17 9a4 4 0 0 1 0 6"/></svg></button>
    <div class="bar"><i style="width:60%"></i></div>
  </div>
</footer>

<script>
const G={1:'var(--g1)',2:'var(--g2)',3:'var(--g3)',4:'var(--g4)',5:'var(--g5)',6:'var(--g6)',7:'var(--g7)'};
const data={
  chart:[[1,'여름밤 산책','하린'],[6,'파란 우산','소담'],[4,'Late Bus','노을'],[5,'노을 지는 방','온도'],[3,'그 골목의 불빛','하린']],
  new:[[7,'새벽 세 시의 도시','하린'],[2,'첫눈 오는 날','하린'],[3,'초록 버스','나무'],[6,'새벽 라디오','밤하늘'],[1,'도시의 밤','하린']]
};
const list=document.getElementById('list');
function render(k){
  list.innerHTML=data[k].map((r,i)=>`<div class="c"><i>${i+1}</i><div class="cover" style="background:${G[r[0]]}"></div><b>${r[1]}</b><span>${r[2]}</span></div>`).join('');
}
render('chart');
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));
  render(b.dataset.t);
}));
const save=document.querySelector('.save');
save.addEventListener('click',()=>{const p=save.getAttribute('aria-pressed')==='true';save.setAttribute('aria-pressed',!p);save.textContent=p?'믹스 저장':'저장됨';});
const pp=document.getElementById('pp');let playing=false;
const PLAY='<path d="M8 5v14l11-7z"/>',PAUSE='<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
pp.addEventListener('click',()=>{playing=!playing;pp.setAttribute('aria-label',playing?'일시정지':'재생');pp.querySelector('svg').innerHTML=playing?PAUSE:PLAY;});
</script>
</body>
</html>
